<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axle Korp AI Coach Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: LMS admin shell. Fixed left rail, top bar with role switch, single working canvas; slide-over panels for preview and detail. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E9EDEB; --line:#D9DFDC; --line-strong:#BFC8C4;
  --fg:#17211E; --muted:#5B6B66; --faint:#86948F;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA; --accent-hover:#0A5649;
  --rail:#12302A; --rail-fg:#C9DCD6; --rail-active:#1E4A41;
  --ok:#1F7A43; --ok-soft:#E1F3E7; --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FCE6E3; --info:#2459A8; --info-soft:#E3ECFA; --idle:#5B6B66; --idle-soft:#E8ECEA;
  --shadow:0 1px 2px rgba(18,48,42,.06),0 8px 24px rgba(18,48,42,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#162120; --sunk:#1C2927; --line:#2A3A37; --line-strong:#3A4E4A;
  --fg:#E6EEEB; --muted:#9FB2AC; --faint:#71847E;
  --accent:#3FB59E; --accent-ink:#06201A; --accent-soft:#163A33; --accent-hover:#56C8B1;
  --rail:#0B1211; --rail-fg:#A9C2BA; --rail-active:#1A2E2A;
  --ok:#5BC984; --ok-soft:#173326; --warn:#E5A93F; --warn-soft:#352914; --bad:#F2847A; --bad-soft:#3A1C19; --info:#7FA9EE; --info-soft:#1A2840; --idle:#9FB2AC; --idle-soft:#22302D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#162120; --sunk:#1C2927; --line:#2A3A37; --line-strong:#3A4E4A;
  --fg:#E6EEEB; --muted:#9FB2AC; --faint:#71847E;
  --accent:#3FB59E; --accent-ink:#06201A; --accent-soft:#163A33; --accent-hover:#56C8B1;
  --rail:#0B1211; --rail-fg:#A9C2BA; --rail-active:#1A2E2A;
  --ok:#5BC984; --ok-soft:#173326; --warn:#E5A93F; --warn-soft:#352914; --bad:#F2847A; --bad-soft:#3A1C19; --info:#7FA9EE; --info-soft:#1A2840; --idle:#9FB2AC; --idle-soft:#22302D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);padding:18px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font:700 14px var(--f-display);color:var(--accent-ink)}
.brand b{font:700 16px var(--f-display);letter-spacing:.01em;color:#F2F7F5}
.brand small{display:block;font-size:11px;color:var(--rail-fg);opacity:.8}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.6;padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;border:0;background:none;color:var(--rail-fg);text-align:left;cursor:pointer;width:100%}
.nav-item:hover{background:var(--rail-active);color:#fff}
.nav-item.active{background:var(--rail-active);color:#fff;font-weight:600}
.nav-item[disabled]{opacity:.35;cursor:not-allowed;background:none}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-lock{margin-left:auto;font-size:10px;opacity:.7}
.rail-foot{margin-top:auto;font-size:11.5px;opacity:.7;padding:0 10px}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumbs{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs b{color:var(--fg);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.role-switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.role-switch select{padding:6px 28px 6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
/* page head */
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head h1{font:700 26px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn-danger:hover{border-color:var(--bad)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-ghost{border-color:transparent;background:none}
.btn-ghost:hover{background:var(--sunk);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:12.5px}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font:600 15px var(--f-body);margin:0}
.panel-body{padding:18px}
/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.strip>div{padding:14px 18px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.strip .v{font:600 22px var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.strip .s{font-size:12px;color:var(--faint)}
/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.field-inline{position:relative}
.field-inline svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.input,.select,.textarea{width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface)}
.input:hover,.select:hover,.textarea:hover{border-color:var(--muted)}
.input.with-icon{padding-left:32px}
.input.invalid,.select.invalid,.textarea.invalid,.drop.invalid{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.toolbar .input,.toolbar .select{width:auto;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg .ct{font-family:var(--f-mono);font-weight:500;font-size:11px;margin-left:4px;opacity:.8}
/* table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 18px;background:var(--sunk);white-space:nowrap}
td{padding:12px 18px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
td.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.t-title{font-weight:600}
.t-sub{font-size:12px;color:var(--faint)}
.row-actions{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end}
.link{background:none;border:0;padding:4px 7px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--accent);cursor:pointer}
.link:hover{background:var(--accent-soft)}
.link.danger{color:var(--bad)}
.link.danger:hover{background:var(--bad-soft)}
.link[disabled]{color:var(--faint);cursor:not-allowed;background:none}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-pub{background:var(--ok-soft);color:var(--ok)}
.p-draft{background:var(--info-soft);color:var(--info)}
.p-inactive{background:var(--idle-soft);color:var(--idle)}
.p-failed{background:var(--bad-soft);color:var(--bad)}
.p-proc{background:var(--warn-soft);color:var(--warn)}
.p-pending{background:var(--idle-soft);color:var(--idle)}
.p-blocked{background:var(--warn-soft);color:var(--warn)}
.pill.spin::before{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;background:var(--sunk);font-size:11.5px;font-weight:600;color:var(--muted)}
.chip svg{width:12px;height:12px}
.note-dot{display:inline-block;margin-left:6px;font-size:11px;color:var(--warn);font-weight:600}
/* form */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.label{font-weight:600;font-size:13px}
.label .req{color:var(--bad);margin-left:2px}
.hint{font-size:12px;color:var(--faint)}
.err{font-size:12px;color:var(--bad);font-weight:500;display:flex;gap:5px;align-items:flex-start}
.counter{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);margin-left:auto}
.counter.over{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.textarea{min-height:240px;resize:vertical;line-height:1.55}
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-card{border:1px solid var(--line-strong);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;background:var(--surface);text-align:left}
.type-card:hover{border-color:var(--muted)}
.type-card.on{border-color:var(--accent);background:var(--accent-soft)}
.type-card .rd{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex:none;margin-top:2px}
.type-card.on .rd{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface);background:var(--accent)}
.type-card b{display:block;font-size:13.5px}
.type-card span{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:26px;text-align:center;background:var(--sunk);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:28px;height:28px;color:var(--accent)}
.drop b{display:block;margin-top:6px}
.file-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.file-ico{width:38px;height:38px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 10.5px var(--f-mono);flex:none}
.side-card{display:flex;flex-direction:column;gap:14px}
.meta-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.meta-list dt{color:var(--muted)}
.meta-list dd{margin:0;font-weight:500}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.banner{display:flex;gap:10px;padding:11px 14px;border-radius:8px;font-size:13px;align-items:flex-start}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px}
.b-info{background:var(--info-soft);color:var(--info)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.banner p{margin:0;color:var(--fg)}
.banner b{color:inherit}
.form-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 var(--r) var(--r);flex-wrap:wrap}
/* processing stepper */
.stepper{display:flex;align-items:center;gap:0}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);font-weight:600}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:11px;background:var(--surface)}
.step.done{color:var(--ok)} .step.done .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.step.cur{color:var(--warn)} .step.cur .dot{border-color:var(--warn)}
.step.fail{color:var(--bad)} .step.fail .dot{border-color:var(--bad);background:var(--bad);color:#fff}
.step-line{flex:1;height:2px;background:var(--line);margin:0 10px;min-width:20px}
.step-line.done{background:var(--ok)}
/* detail layout */
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.excerpt{background:var(--sunk);border-radius:8px;padding:14px;font-size:13px;color:var(--muted);max-height:220px;overflow:auto;white-space:pre-wrap}
/* chat */
.chat{display:flex;flex-direction:column;height:620px}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.coach-ava{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.coach-ava svg{width:18px;height:18px}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:86%;display:flex;flex-direction:column;gap:4px}
.msg .bub{padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.5}
.msg.bot{align-self:flex-start}
.msg.bot .bub{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px}
.msg .meta{font-size:11px;color:var(--faint);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg.sys{align-self:center;font-size:11.5px;color:var(--faint);background:var(--sunk);padding:3px 10px;border-radius:99px}
.msg .bub.guard{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.msg .bub.fallback{background:var(--sunk);border-style:dashed}
.msg .bub.failed{background:var(--bad-soft);border-color:transparent;color:var(--bad);font-weight:600}
.prompts{display:flex;gap:6px;flex-wrap:wrap}
.prompt{border:1px solid var(--line-strong);background:var(--surface);padding:5px 11px;border-radius:99px;font-size:12.5px;cursor:pointer;font-weight:500}
.prompt:hover{border-color:var(--accent);color:var(--accent)}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.chat-input .textarea{min-height:42px;max-height:120px;resize:none}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.learner-card{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.learner-ava{width:44px;height:44px;border-radius:50%;background:var(--info-soft);color:var(--info);display:grid;place-items:center;font-weight:700}
.status-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(460px,100%);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font:700 18px var(--f-display)}
.modal p{margin:0;color:var(--muted)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px}
.modal-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.modal-ico svg{width:20px;height:20px}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:8px;align-items:center;max-width:380px;animation:tin .2s ease-out}
.toast.bad{background:var(--bad);color:#fff}
.toast svg{width:16px;height:16px;flex:none}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.empty{padding:48px 18px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--faint)}
.empty b{display:block;color:var(--fg);font-size:15px;margin:8px 0 4px}
.proto-states{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.proto-states select{padding:4px 8px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--surface);font-size:12px}
.credit-bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.credit-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.preview-flag{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--info);background:var(--info-soft);padding:3px 8px;border-radius:5px}
.dd-wrap{position:relative}
.dd-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow:auto;z-index:10}
.dd-list button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;font-size:13px}
.dd-list button:hover{background:var(--accent-soft)}
.dd-list small{color:var(--faint);display:block;font-size:11.5px}
/* learner course view */
.course-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:18px 20px}
.course-hero h1{font:700 24px/1.2 var(--f-display);margin:2px 0 0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.progress{min-width:200px;flex:0 1 260px;margin-left:auto}
.progress .credit-bar{margin-top:6px}
.learn-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.lessons{list-style:none;margin:0;padding:6px}
.lessons button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.lessons button:hover{background:var(--sunk)}
.lessons button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lessons .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font:500 11px var(--f-mono);flex:none}
.lessons .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson-stage{aspect-ratio:16/9;max-width:100%;border-radius:8px;background:linear-gradient(135deg,var(--rail) 0%,var(--accent) 140%);display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.lesson-stage b{font:700 22px var(--f-display);display:block}
.lesson-stage span{opacity:.75;font-size:13px}
.proto-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px;border:1px dashed var(--line-strong);border-radius:8px;font-size:12px;color:var(--faint)}
.proto-bar select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px}
.launcher{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow);cursor:pointer;z-index:20}
.launcher:hover{background:var(--accent-hover)}
.launcher .coach-ava{background:var(--accent-ink);color:var(--accent);width:34px;height:34px;border-radius:50%}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:din .2s ease-out}
@keyframes din{from{transform:translateX(24px);opacity:0}}
.drawer .chat-body{flex:1}
.drawer-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:7px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--fg)}
.icon-btn svg{width:17px;height:17px}
.voice-pad{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
.mic-btn{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.mic-btn svg{width:26px;height:26px}
.mic-btn.rec{background:var(--bad);color:#fff;animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.bars{display:flex;gap:3px;height:22px;align-items:center}
.bars i{width:3px;border-radius:2px;background:var(--bad);animation:bar .9s ease-in-out infinite}
.bars i:nth-child(odd){animation-delay:.2s}.bars i:nth-child(3n){animation-delay:.4s}
@keyframes bar{0%,100%{height:5px}50%{height:22px}}
.unavail{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:13px}
.unavail svg{width:17px;height:17px;flex:none;margin-top:1px}
@media (max-width:1100px){.form-grid,.detail-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.learn-grid{grid-template-columns:minmax(0,1fr)}.launcher{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px}
  .nav-group{flex-direction:row;flex-wrap:wrap}
  .nav-label,.rail-foot,.brand small{display:none}
  .nav-item{width:auto}
  .top{padding:10px 16px;flex-wrap:wrap;position:static}
  .content{padding:18px 16px 40px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip>div:nth-child(3){border-left:0}
  .strip>div:nth-child(n+3){border-top:1px solid var(--line)}
  .fields,.type-cards{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .toolbar .input,.toolbar .select{min-width:0;width:100%}
  .toolbar .field-inline{width:100%}
  .chat{height:540px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    $('#nav').innerHTML='<div class="nav-label">My Learning</div>'+ENROL.map(e=>{const c=course(e.courseId);return `<button class="nav-item ${S.lc.courseId===e.courseId?'active':''}" data-act="l-course" data-id="${e.courseId}">${I.book}<span>${esc(c.title)}</span></button>`;}).join('');
    $('#ava').textContent=ROLE.learner.ini; return;
  }
  const items=[
    ['settings','Coach Settings',I.gear],
    ['sources','Knowledge Sources',I.book],
    ['report','Conversation History',I.chat]
  ];
  const active = {form:'sources',detail:'sources',session:'report'}[S.view]||S.view;
  $('#nav').innerHTML = '<div class="nav-label">AI Coach</div>'+items.map(([v,l,ic])=>{
    const ok=canSee(v);
    return `<button class="nav-item ${active===v?'active':''}" data-act="go" data-v="${v}" ${ok?'':'disabled title="Not available for '+ROLE[S.role].name+'"'}>${ic}<span>${l}</span>${ok?'':'<span class="nav-lock">No access</span>'}</button>`;
  }).join('');
  $('#ava').textContent = ROLE[S.role].ini;
}
function crumbs(parts){ $('#crumbs').innerHTML = 'AI Coach / '+parts.map((p,i)=>i===parts.length-1?'<b>'+esc(p)+'</b>':esc(p)).join(' / '); }

function vSources(){
  crumbs(['Knowledge Sources']);
  const list=S.sources.filter(k=>{
    const t=course(k.courseId).title.toLowerCase();
    if(S.q && !t.includes(S.q.toLowerCase())) return false;
    if(S.fStatus!=='All' && displayStatus(k)!==S.fStatus) return false;
    return true;
  });
  const count=st=>S.sources.filter(k=>st==='All'||displayStatus(k)===st).length;
  const pub=count('Published'), draft=count('Draft'), att=S.sources.filter(k=>k.proc==='Failed').length;
  const segs=['All','Published','Draft','Processing','Failed','Inactive'];
  const rows=list.map(k=>{
    const c=course(k.courseId);
    return `<tr>
      <td>${esc(c.cat)}</td>
      <td><div class="t-title">${esc(c.title)}</div>${k.pendingEdit?'<div class="t-sub" style="color:var(--warn)">Unpublished changes</div>':''}</td>
      <td><span class="chip">${k.type==='manual'?I.text:I.file}${esc(srcType(k))}</span></td>
      <td>${statusPill(k)}</td>
      <td class="num">${esc(k.modAt)}<div class="t-sub" style="font-family:var(--f-body)">${esc(k.modBy)}</div></td>
      <td><div class="row-actions">${rowActions(k)}</div></td></tr>`;
  }).join('');
  return `<div class="page-head"><div><h1>Knowledge Sources</h1><p>One knowledge source per course. The Coach answers only from the published knowledge of that course.</p></div>
    <div class="actions"><button class="btn btn-primary" data-act="new">${I.plus}Add knowledge source</button></div></div>
  <div class="strip">
    <div><div class="k">Courses with a Coach</div><div class="v">${S.sources.length}</div><div class="s">of ${COURSES.length} courses</div></div>
    <div><div class="k">Live for learners</div><div class="v">${pub}</div><div class="s">Published and active</div></div>
    <div><div class="k">Drafts</div><div class="v">${draft}</div><div class="s">Ready to preview</div></div>
    <div><div class="k">Needs attention</div><div class="v" style="color:${att?'var(--bad)':'inherit'}">${att}</div><div class="s">Processing failed</div></div>
  </div>
  <section class="panel">
    <div class="toolbar">
      <div class="field-inline">${I.search}<input id="q" class="input with-icon" placeholder="Search by course title" value="${esc(S.q)}" aria-label="Search by course title"></div>
      <div class="seg" role="group" aria-label="Filter by status">${segs.map(s=>`<button data-act="fstatus" data-s="${s}" class="${S.fStatus===s?'on':''}">${s}<span class="ct">${count(s)}</span></button>`).join('')}</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Course Category</th><th>Course Title</th><th>Source Type</th><th>Status</th><th>Last Modified</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="6"><div class="empty">${I.inbox}<b>No knowledge sources match</b>Try a different course title or status filter.</div></td></tr>`}</tbody>
    </table></div>
  </section>`;
}
function rowActions(k){
  const a=[`<button class="link" data-act="view" data-id="${k.id}">View</button>`];
  if(k.proc==='Pending'||k.proc==='Processing'){ a.push(`<button class="link" disabled>Publish</button>`); }
  else if(k.proc==='Failed'){ a.push(`<button class="link" data-act="edit" data-id="${k.id}">Edit</button>`,`<button class="link" data-act="retry" data-id="${k.id}">Retry</button>`); }
  else if(k.status==='Published'){ a.push(`<button class="link" data-act="edit" data-id="${k.id}">Edit</button>`); if(k.pendingEdit) a.push(`<button class="link" data-act="publish" data-id="${k.id}">Publish</button>`); a.push(`<button class="link" data-act="deactivate" data-id="${k.id}">Deactivate</button>`); }
  else if(k.status==='Draft'){ a.push(`<button class="link" data-act="edit" data-id="${k.id}">Edit</button>`,`<button class="link" data-act="publish" data-id="${k.id}">Publish</button>`); }
  else if(k.status==='Inactive'){ a.push(`<button class="link" data-act="reactivate" data-id="${k.id}">Reactivate</button>`); }
  a.push(`<button class="link danger" data-act="delete" data-id="${k.id}">Delete</button>`);
  return a.join('');
}

function vDetail(){
  const k=S.sources.find(x=>x.id===S.detailId); if(!k){S.view='sources';return vSources();}
  const c=course(k.courseId);
  crumbs(['Knowledge Sources',c.title]);
  const st=k.proc;
  const stepCls=(i)=>{const order=['Pending','Processing','Completed'];const cur=st==='Failed'?1:order.indexOf(st);if(st==='Failed'&&i===2)return 'fail';if(i<cur||(st==='Completed'))return 'done';if(i===cur)return st==='Failed'?'fail':'cur';return '';};
  const canPreview=st==='Completed';
  const canPublish=st==='Completed'&&(k.status==='Draft'||k.pendingEdit);
  const learnerImpact={Published:'Live. Enrolled learners can use the Coach in this course.',Draft:'Not visible to learners until you publish.',Inactive:'Unavailable for new learner chats. Reactivate to restore the last published knowledge.'}[k.status];
  return `<div class="page-head"><div><button class="btn btn-ghost btn-sm" data-act="go" data-v="sources" style="margin-bottom:8px">${I.back}Knowledge Sources</button>
    <h1>${esc(c.title)}</h1><p>${esc(c.cat)} · ${esc(srcType(k))} · ${statusPill(k)}</p></div>
    <div class="actions">
      ${k.status!=='Inactive'&&st!=='Pending'&&st!=='Processing'?`<button class="btn" data-act="edit" data-id="${k.id}">Edit / Replace</button>`:''}
      ${st==='Failed'?`<button class="btn" data-act="retry" data-id="${k.id}">${I.refresh}Retry processing</button>`:''}
      ${k.status==='Published'?`<button class="btn" data-act="deactivate" data-id="${k.id}">${I.pause}Deactivate</button>`:''}
      ${k.status==='Inactive'?`<button class="btn" data-act="reactivate" data-id="${k.id}">Reactivate</button>`:''}
      <button class="btn btn-danger" data-act="delete" data-id="${k.id}">${I.trash}Delete</button>
      <button class="btn btn-primary" data-act="publish" data-id="${k.id}" ${canPublish?'':'disabled'} title="${canPublish?'':'Available after processing completes'}">${k.pendingEdit?'Publish update':'Publish'}</button>
    </div></div>
  <div class="detail-grid">
    <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <section class="panel"><div class="panel-head"><h2>Processing</h2></div><div class="panel-body" style="display:flex;flex-direction:column;gap:14px">
        <div class="stepper"><div class="step ${stepCls(0)}"><span class="dot">${stepCls(0)==='done'?'✓':'1'}</span>Pending</div><div class="step-line ${['done'].includes(stepCls(1))||st==='Completed'?'done':''}"></div><div class="step ${stepCls(1)}"><span class="dot">${stepCls(1)==='done'?'✓':'2'}</span>Processing</div><div class="step-line ${st==='Completed'?'done':''}"></div><div class="step ${stepCls(2)}"><span class="dot">${st==='Completed'?'✓':st==='Failed'?'!':'3'}</span>${st==='Failed'?'Failed':'Completed'}</div></div>
        ${st==='Failed'?`<div class="banner b-bad">${I.warn}<p><b>${esc(k.failMsg||'Knowledge processing failed. Please retry or upload another document.')}</b>${k.status==='Published'||k.pendingEdit?'<br>Learners keep using the previously published knowledge.':''}</p></div>`:''}
        ${st==='Processing'||st==='Pending'?`<div class="banner b-warn">${I.info}<p>Extracting and indexing content. Preview and Publish unlock when this completes.</p></div>`:''}
        ${k.pendingEdit&&st==='Completed'?`<div class="banner b-warn">${I.info}<p>This draft update is processed but not published. Learners still see the previous version.</p></div>`:''}
        <div class="banner ${k.status==='Published'?'b-ok':'b-info'}">${I.info}<p><b>Learner impact.</b> ${learnerImpact}</p></div>
      </div></section>
      <section class="panel"><div class="panel-head"><h2>Source details</h2></div><div class="panel-body" style="display:flex;flex-direction:column;gap:16px">
        <dl class="kv">
          <dt>Course Category</dt><dd>${esc(c.cat)}</dd>
          <dt>Course Title</dt><dd>${esc(c.title)}</dd>
          <dt>Knowledge Source Type</dt><dd>${k.type==='manual'?'Manual Entry':'Document Upload'}</dd>
          ${k.file?`<dt>Document</dt><dd style="overflow-wrap:anywhere">${esc(k.file.name)} <span class="t-sub">· ${k.file.size.toFixed(1)} MB</span></dd>`:`<dt>Characters</dt><dd class="mono">${k.content.length.toLocaleString('en-IN')} / 20,000</dd>`}
          <dt>Created</dt><dd>${esc(k.createdBy)} · <span class="mono">${esc(k.createdAt)}</span></dd>
          <dt>Last modified</dt><dd>${esc(k.modBy)} · <span class="mono">${esc(k.modAt)}</span></dd>
        </dl>
        ${k.type==='manual'?`<div><div class="label" style="margin-bottom:6px">Knowledge Content</div><div class="excerpt">${esc(k.content)}</div></div>`:''}
      </div></section>
    </div>
    ${previewPanel(k,canPreview)}
  </div>`;
}
function previewPanel(k,can){
  if(!can) return `<section class="panel"><div class="chat-head"><div class="coach-ava">${I.spark}</div><div><b>Preview and test</b><div class="t-sub">Draft knowledge only</div></div></div>
    <div class="empty" style="padding:64px 24px">${I.spark}<b>Preview isn't available yet</b>${k.proc==='Failed'?'Fix the failed source and process it again to start testing.':'Preview opens once processing completes.'}</div></section>`;
  const msgs=S.chat.map(m=>{
    if(m.r==='sys') return `<div class="msg sys">${esc(m.t)}</div>`;
    if(m.r==='typing') return `<div class="msg bot"><div class="bub typing"><i></i><i></i><i></i></div></div>`;
    return `<div class="msg ${m.r==='me'?'me':'bot'}"><div class="bub ${m.k||''}">${esc(m.t)}</div>${m.r==='bot'&&m.prompts?`<div class="prompts">${m.prompts.map(p=>`<button class="prompt" data-act="ask" data-q="${esc(p)}">${esc(p)}</button>`).join('')}</div>`:''}${m.r==='bot'&&m.k==='failed'?'<div><button class="link" data-act="retry-msg">Retry</button></div>':''}</div>`;
  }).join('');
  return `<section class="panel chat" aria-label="Preview chat">
    <div class="chat-head"><div class="coach-ava">${I.spark}</div><div><b>${esc(S.coachSaved)}</b><div class="t-sub">${esc(course(k.courseId).title)}</div></div>
      <span class="preview-flag" style="margin-left:auto">${k.status==='Published'&&!k.pendingEdit?'Published knowledge':'Draft preview'}</span>
      <button class="btn btn-sm btn-ghost" data-act="new-chat">${I.refresh}New Chat</button></div>
    <div style="padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="chip">${I.shield}Assessment protection on</span>
      <label class="proto-states" for="proto">Prototype state
        <select id="proto"><option value="normal" ${S.protoState==='normal'?'selected':''}>Normal</option><option value="down" ${S.protoState==='down'?'selected':''}>AI service unavailable</option><option value="credits" ${S.protoState==='credits'?'selected':''}>AI credits exhausted</option><option value="fail" ${S.protoState==='fail'?'selected':''}>Response fails</option></select></label>
    </div>
    <div class="chat-body" id="chat-body">${msgs}</div>
    ${S.protoState==='credits'?`<div class="banner b-warn" style="margin:0 12px 0;border-radius:8px">${I.warn}<p>AI Coach is temporarily unavailable due to the AI service limit. Please contact your administrator.</p></div>`:''}
    <form class="chat-input" id="chat-form"><textarea id="chat-in" class="textarea" rows="1" maxlength="600" placeholder="Ask a sample question learners might ask" ${S.protoState==='credits'?'disabled':''}></textarea><button class="btn btn-primary" type="submit" aria-label="Send" ${S.protoState==='credits'?'disabled':''}>${I.send}</button></form>
    <div class="hint" style="padding:0 14px 10px">Preview chats are not saved to learner history.</div>
  </section>`;
}

function vReport(){
  crumbs(['Conversation History']);
  const r=S.rep;
  const coursesIn=COURSES.filter(c=>!r.cat||c.cat===r.cat);
  const list=SESSIONS.filter(s=>(!r.cat||s.cat===r.cat)&&(!r.course||s.course===r.course)&&(!r.learner||s.learner===r.learner)&&(!r.from||s.date>=r.from)&&(!r.to||s.date<=r.to)&&(!r.status||s.status===r.status))
    .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const learners=[...new Map(SESSIONS.map(s=>[s.learner,s])).values()];
  const fmt=d=>{const [y,m,dd]=d.split('-');return dd+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+'-'+y;};

const nowT=()=>{const d=new Date();let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+m+' '+ap;};
function lStart(note){ const L=S.lc; L.msgs=(note?[{r:'sys',t:note}]:[]).concat([{r:'bot',t:"Hi! I'm your AI Coach. How can I help you with this course?",prompts:['Explain a topic','Give me an example','Summarize a concept']}]); L.log=[]; L.started=new Date(); L.draft=''; L.err=''; L.rec=null; }
function lEnd(){
  const L=S.lc; if(!L.log||!L.log.length) return;
  const c=course(L.courseId), d=L.started, hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  SESSIONS.push({id:'S-'+(24200+SESSIONS.length),learner:'Kavya Nair',mail:'kavya.nair@axlekorp.com',lid:'AK-1042',cat:c.cat,course:c.title,date:'2026-10-13',time:hh+':'+mm,status:'Completed',items:L.log.slice()});
  L.log=[];
}
function lAsk(q,mode){
  const L=S.lc; mode=mode||'Text';
  L.msgs.push({r:'me',t:q,time:nowT(),mode}); L.msgs.push({r:'typing'}); L.last={q,mode}; render();
  setTimeout(()=>{
    L.msgs=L.msgs.filter(m=>m.r!=='typing');
    const cs=coachState(); const e=ENROL.find(x=>x.courseId===L.courseId);
    if(L.proto==='fail'){ L.msgs.push({r:'bot',t:'Unable to generate a response. Please try again.',k:'failed',retry:true}); L.log.push([nowT(),q,null,mode,'Failed']); return render(); }
    const {a,kind}=answerFor(q,cs.k,/quiz|assessment/i.test(e.lessons[L.lesson]));
    L.msgs.push({r:'bot',t:a,k:kind}); L.log.push([nowT(),q,a,mode,kind==='guard'?'Blocked':'Success']); render();
  },800);
}

/* ---------- bindings ---------- */
function bind(){
  const q=$('#q'); if(q) q.oninput=e=>{S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos);};
  const cn=$('#cname'); if(cn) cn.oninput=e=>{S.coachName=e.target.value; $('#cname-ct').textContent=S.coachName.length+' / 100'; $('#cname-ct').classList.toggle('over',S.coachName.length>100); $('#cname-prev').textContent=S.coachName||'AI Coach';};
  if(S.view==='form'){
    const cat=$('#f-cat'); cat&&(cat.onchange=e=>{S.form.cat=e.target.value; S.form.courseId=''; delete S.errors.cat; render();});
    const co=$('#f-course'); co&&(co.onchange=e=>{S.form.courseId=e.target.value; delete S.errors.course; render();});
    const ct=$('#f-content'); ct&&(ct.oninput=e=>{S.form.content=e.target.value; const l=S.form.content.length; $('#f-ct').textContent=l.toLocaleString('en-IN')+' / 20,000'; $('#f-ct').classList.toggle('over',l>20000);});
    const fi=$('#f-file'); fi&&(fi.onchange=e=>takeFile(e.target.files[0]));
    const dr=$('#drop'); if(dr){
      dr.ondragover=e=>{e.preventDefault();dr.classList.add('over');}; dr.ondragleave=()=>dr.classList.remove('over');
      dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');takeFile(e.dataTransfer.files[0]);};
    }
  }
  const cf=$('#chat-form'); if(cf){
    cf.onsubmit=e=>{e.preventDefault(); const v=$('#chat-in').value.trim(); if(v) ask(v);};
    $('#chat-in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();cf.requestSubmit();}};
  }
  const ps=$('#proto'); ps&&(ps.onchange=e=>{S.protoState=e.target.value; render();});
  if(S.view==='course'){
    const L=S.lc;
    const en=$('#l-enrol'); en&&(en.onchange=e=>{ if(!['Active','Completed'].includes(e.target.value)&&L.open){lEnd();L.open=false;} L.enrol=e.target.value; render();});
    const lp=$('#l-proto'); lp&&(lp.onchange=e=>{L.proto=e.target.value; L.rec=null; render();});
    const lf=$('#l-form'); if(lf){
      const li=$('#l-in');
      li.oninput=()=>{L.draft=li.value; const n=li.value.length; $('#l-ct').textContent=n+' / 500'; $('#l-ct').classList.toggle('over',n>500);};
      li.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();lf.requestSubmit();}};
      lf.onsubmit=e=>{e.preventDefault(); const v=(L.draft||'').trim(); if(!v) return;
        if(v.length>500){ L.err='Your question exceeds the maximum allowed character limit.'; return render(); }
        L.err=''; L.draft=''; lAsk(v,'Text'); setTimeout(()=>{const n=$('#l-in'); n&&n.focus();},0); };
    }
  }
  if(S.view==='report'){
    const upd=(k,id)=>{const el=$(id); el.onchange=e=>{S.rep[k]=e.target.value; if(k==='cat') S.rep.course=''; render();};};
    upd('cat','#r-cat');upd('course','#r-course');upd('from','#r-from');upd('to','#r-to');upd('status','#r-status');
    const li=$('#r-learner'), dd=$('#r-dd');
    const show=()=>{const t=li.value.toLowerCase(); const opts=[...new Map(SESSIONS.map(s=>[s.learner,s])).values()].filter(s=>!t||s.learner.toLowerCase().includes(t)||s.lid.toLowerCase().includes(t));
      dd.innerHTML=opts.map(s=>`<button type="button" data-l="${esc(s.learner)}">${esc(s.learner)}<small>${esc(s.lid)} · ${esc(s.mail)}</small></button>`).join('')||'<div class="hint" style="padding:10px 12px">No learners match</div>'; dd.hidden=false;};
    li.onfocus=show; li.oninput=()=>{show(); if(!li.value){S.rep.learner='';render();}};
    li.onblur=()=>setTimeout(()=>{dd.hidden=true;},150);
    dd.onmousedown=e=>{const b=e.target.closest('button'); if(b){S.rep.learner=b.dataset.l; render();}};
  }
}
function takeFile(file){
  if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase(), mb=file.size/1048576;
  if(!['pdf','doc','docx','txt','ppt','pptx'].includes(ext)){ S.errors.file='Unsupported file format. Please upload PDF, DOC, DOCX, TXT, PPT or PPTX.'; render(); return; }
  if(mb>20){ S.errors.file='File size exceeds the maximum allowed limit of 20 MB.'; render(); return; }
  S.form.file={name:file.name,size:Math.max(mb,0.1)}; delete S.errors.file; render();
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, id=b.dataset.id, k=id&&S.sources.find(x=>x.id===id);
  if(a==='modal-close'){ if(e.target===b||b.tagName==='BUTTON') $('#modal-root').innerHTML=''; return; }
  if(a==='go') return go(b.dataset.v);
  if(a==='fstatus'){ S.fStatus=b.dataset.s; return render(); }
  if(a==='new'){ S.editing=null; S.form={cat:'',courseId:'',type:'',content:'',file:null}; return go('form'); }
  if(a==='edit'){ S.editing=id; const c=course(k.courseId); S.form={cat:c.cat,courseId:k.courseId,type:k.type,content:k.content,file:k.file?{...k.file}:null}; return go('form'); }
  if(a==='view'){ S.detailId=id; S.chat=welcome(); S.protoState='normal'; return go('detail'); }
  if(a==='ftype'){ S.form.type=b.dataset.t; delete S.errors.type; return render(); }
  if(a==='file-remove'){ S.form.file=null; return render(); }
  if(a==='file-replace'){ $('#f-file').click(); return; }
  if(a==='save') return save();
  if(a==='retry'){ k.modAt=today(); k.modBy=ROLE[S.role].user; process(k,true); toast('Retrying knowledge processing.'); return render(); }
  if(a==='publish'){ k.status='Published'; k.pendingEdit=false; k.modAt=today(); k.modBy=ROLE[S.role].user; toast('Knowledge Source published successfully.'); return render(); }
  if(a==='deactivate') return modal({title:'Deactivate knowledge source?',body:'Are you sure you want to deactivate this Knowledge Source? AI Coach will become unavailable to learners.',confirm:'Deactivate',icon:I.pause,onOk:()=>{k.status='Inactive';k.modAt=today();k.modBy=ROLE[S.role].user;toast('Knowledge Source deactivated.');render();}});
  if(a==='reactivate'){ k.status='Published'; k.modAt=today(); k.modBy=ROLE[S.role].user; toast('Knowledge Source activated successfully.'); return render(); }
  if(a==='delete') return modal({title:'Delete knowledge source?',body:'Are you sure you want to delete this Knowledge Source? This action cannot be undone. The AI Coach will be unavailable in this course until a new source is published.',confirm:'Delete',danger:true,icon:I.trash,onOk:()=>{S.sources=S.sources.filter(x=>x.id!==id);toast('Knowledge Source deleted.');if(S.view==='detail')go('sources');else render();}});
  if(a==='ask') return ask(b.dataset.q);
  if(a==='new-chat'){ S.chat=[{r:'sys',t:'New conversation started.'},...welcome()]; return render(); }
  if(a==='retry-msg'){ const last=[...S.chat].reverse().find(m=>m.r==='me'); S.chat=S.chat.filter(m=>m.k!=='failed'); S.protoState='normal'; if(last) respond(last.t); return; }
  if(a==='name-save'){
    const n=S.coachName.trim();
    if(!n){ S.errors.name='Please enter the AI Coach name.'; return render(); }
    if(n.length>100){ S.errors.name='AI Coach name cannot exceed 100 characters.'; return render(); }
    S.errors={}; S.coachSaved=n; S.coachName=n; toast('AI Coach name saved successfully.'); return render();
  }
  if(a==='name-reset'){ S.coachName=S.coachSaved; S.errors={}; return render(); }
  if(a==='session'){ S.sessionId=id; return go('session'); }
  if(a==='r-clear'){ S.rep={cat:'',course:'',learner:'',from:'',to:'',status:''}; return render(); }
  /* learner */
  const L=S.lc;
  if(a==='l-course'){ if(L.open){lEnd();L.open=false;} L.courseId=id; L.lesson=null; return render(); }
  if(a==='l-lesson'){ L.lesson=+b.dataset.i; return render(); }
  if(a==='l-open'){ L.open=true; lStart(); return render(); }
  if(a==='l-close'){ lEnd(); L.open=false; L.msgs=[]; return render(); }
  if(a==='l-new'){ lEnd(); lStart('New conversation started.'); return render(); }
  if(a==='l-ask'){ if(L.proto==='credits') return; return lAsk(b.dataset.q,'Text'); }
  if(a==='l-retry'){ L.msgs=L.msgs.filter(m=>!(m.k==='failed'&&m.retry)); L.proto='normal'; const last=L.last; if(last){ L.msgs.pop(); lAsk(last.q,last.mode);} return; }
  if(a==='l-mode'){ L.mode=b.dataset.m; L.rec=null; return render(); }
  if(a==='l-rec'){
    if(L.proto==='mic'){ L.mode='text'; L.msgs.push({r:'bot',t:'Microphone access is required for voice interaction. Please enable microphone permission.',k:'failed'}); return render(); }
    if(L.proto==='lang'){ L.mode='text'; L.msgs.push({r:'bot',t:'Voice interaction is not available in the selected language. Please use Text mode.',k:'failed'}); return render(); }
    L.rec='listening'; return render();
  }
  if(a==='l-stop'){
    L.rec='processing'; render();
    setTimeout(()=>{ L.rec=null;
      if(L.proto==='norec'){ L.msgs.push({r:'bot',t:'Unable to recognize your voice input. Please try again.',k:'failed'}); return render(); }
      const pool=VOICE_SAMPLES[L.courseId]||['Summarize this lesson']; L.vi=((L.vi||0)+1)%pool.length; lAsk(pool[L.vi],'Voice'); },1100);
    return;
  }
});
$('#role').onchange=e=>{ if(S.lc.open){lEnd();S.lc.open=false;} S.role=e.target.value; S.view=S.role==='learner'?'course':'sources'; render(); window.scrollTo(0,0); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#modal-root').innerHTML=''; });

function save(){
  const f=S.form, er={};
  if(!f.cat) er.cat='Please select a course category.';
  if(!f.courseId) er.course='Please select a course.';
  if(!f.type) er.type='Please select a knowledge source type.';
  if(f.type==='manual'){ if(!f.content.trim()) er.content='Please enter knowledge content.'; else if(f.content.length>20000) er.content='Knowledge content cannot exceed 20,000 characters.'; }
  if(f.type==='doc'&&!f.file) er.file='Please upload a document.';
  S.errors=er; if(Object.keys(er).length) return render();
  const user=ROLE[S.role].user;
  let k;
  if(S.editing){ k=S.sources.find(x=>x.id===S.editing); const wasLive=k.status==='Published'; Object.assign(k,{type:f.type,content:f.type==='manual'?f.content:'',file:f.type==='doc'?f.file:null,modBy:user,modAt:today()}); if(wasLive) k.pendingEdit=true; }
  else { k={id:'k'+Date.now(),courseId:f.courseId,type:f.type,content:f.type==='manual'?f.content:'',file:f.type==='doc'?f.file:null,status:'Draft',createdBy:user,createdAt:today(),modBy:user,modAt:today(),pendingEdit:false}; S.sources.unshift(k); }
  process(k);
  toast('Knowledge Source saved successfully.');
  S.detailId=k.id; S.chat=welcome(); S.protoState='normal'; go('detail');
}
function process(k){
  k.proc='Pending'; delete k.failMsg;
  setTimeout(()=>{ k.proc='Processing'; if(S.view==='detail'||S.view==='sources') render(); },1000);
  setTimeout(()=>{
    const n=(k.file&&k.file.name.toLowerCase())||'';
    if(/scan/.test(n)){ k.proc='Failed'; k.failMsg='Unable to extract readable content. Please upload a valid text-based document.'; }
    else if(/protect|locked/.test(n)){ k.proc='Failed'; k.failMsg='Unable to process a password-protected document. Please upload an unlocked file.'; }
    else if(/corrupt/.test(n)){ k.proc='Failed'; k.failMsg='Unable to process the document. Please upload a valid file.'; }
    else k.proc='Completed';
    if(k.proc==='Failed') toast('Knowledge processing failed. Please retry or upload another document.',true);
    if(S.view==='detail'||S.view==='sources') render();
  },3200);
}

/* ---------- preview chat ---------- */
function welcome(){ return [{r:'bot',t:"Hi! I'm your AI Coach. How can I help you with this course?",prompts:['Explain a topic','Give me an example','Summarize a concept']}]; }
function ask(q){ S.chat.push({r:'me',t:q}); respond(q); }
function respond(q){
  S.chat.push({r:'typing'}); render();
  setTimeout(()=>{
    S.chat=S.chat.filter(m=>m.r!=='typing');
    const k=S.sources.find(x=>x.id===S.detailId), t=q.toLowerCase();
    if(S.protoState==='down'){ S.chat.push({r:'bot',t:'AI Coach is temporarily unavailable. Please try again later.',k:'failed'}); return render(); }
    if(S.protoState==='fail'){ S.chat.push({r:'bot',t:'Unable to generate a response. Please try again.',k:'failed'}); return render(); }
    const {a,kind}=answerFor(q,k,false);
    S.chat.push({r:'bot',t:a,k:kind}); render();
  },700);
}
function answerFor(q,k,assessActive){
  const t=q.toLowerCase().trim();
  const quizAsk=/(answer|correct option|option [a-d]|true or false|which option|is it [a-d])/.test(t) && (/(quiz|assessment|test|question \d|q\d)/.test(t)||assessActive);
  if(quizAsk) return {a:"I can help explain the concept, but I can't provide the answer to an active assessment.",kind:'guard'};
  if(t==='explain a topic') return {a:'Sure. Which topic from this course would you like me to explain?',kind:''};
  if(t==='give me an example') return {a:'Happy to. Which concept should the example cover?',kind:''};
  if(t==='summarize a concept') return {a:'Which concept would you like summarized?',kind:''};
  if(t.split(/\s+/).length<2 && t.length<6) return {a:'Could you please provide more details about your question?',kind:''};
  const src=knowledgeText(k).split(/\n+/).flatMap(p=>p.split(/(?<=\.)\s+/));
  const words=t.replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w.length>3&&!['what','does','give','about','with','that','this','from','have','your','tell','explain','example','please','could','would','some','more'].includes(w));
  let best=null,score=0; src.forEach(s=>{const sl=s.toLowerCase(); const sc=words.filter(w=>sl.includes(w.replace(/s$/,''))).length; if(sc>score){score=sc;best=s;}});
  if(best&&score>0) return {a:best.trim(),kind:''};
  return {a:"I couldn't find that information in this course's provided knowledge.",kind:'fallback'};
}

render();
})();
</script>
